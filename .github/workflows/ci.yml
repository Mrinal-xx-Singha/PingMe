name: CI / Build Verification

# 1. TriggersL When should this workflow run?
on:
    push:
        branches: ["main", "feat/typing-indicator"]
    pull_request:
        branches: ["main"]

jobs:
    # Job1: Test and verify backend dependencies & syntax
    backend:
        name: Backend Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Validate syntax of entry point
              working-directory: ./backend
              run: node --check src/index.js
    # Job2: Test, lint & build frontend
    frontend:
        name: Frontend Build & Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Run Vite production build
              working-directory: ./frontend
              run: npm run build
